name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          python3 -m pip install pymupdf pytest striprtf ruff

      # What ships in the app binary, and nothing else — the dev toolchain's own
      # advisories are not a reason to fail a build of the office (#143).
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Fetch sources
        run: make fetch-sources

      - name: Extract data
        run: make extract

      - name: Full test suite
        run: make test

      - name: Data integrity check
        run: make check-integrity

  mobile-light:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build dist
        run: make build

      - name: Capacitor sync (web-to-native bridge check)
        run: |
          npx cap sync
          python3 tools/check_mobile_sync.py

