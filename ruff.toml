# Ruff — Python linting for tools/ (extraction, validation, tests).
# Curated to the high-value, low-noise families: dead code (F), pycodestyle
# core formatting (E/W), import sorting (I), and safe modernization (UP).
# Deliberately NOT the default preview set (RUF/SIM/PERF/DTZ/...): those
# propose refactors the extraction code intentionally avoids (see AGENTS.md,
# "measuring the page, never a proxy"). Add a rule only if it catches a real
# class of mistake and the existing code passes it.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]

exclude = [
  ".build",
  ".venv",
  "boneyard",
  "dist",
  "sources",
  "data",
  "android",
  "ios",
]
